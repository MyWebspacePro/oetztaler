<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ÖVG · Einsatzplanung</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div class="logo">ÖV</div>
    <div class="brandtext">
      <h1>Ötztaler Verkehrsgesellschaft mbH</h1>
      <span>Einsatzplanung · Touren, Busse &amp; Fahrer</span>
    </div>
  </div>
  <div class="topactions">
    <button id="btn-optimize" class="btn primary" title="Lücken füllen und Lenkzeit-/Ruhezeit-Konflikte automatisch beheben">⚡ Optimieren</button>
    <button id="btn-reset" class="btn ghost" title="Alle Änderungen verwerfen und Demo-Daten neu generieren">↺ Demo zurücksetzen</button>
    <div class="themeswitch" id="themeswitch" role="group" aria-label="Farbschema umschalten">
      <button data-th="light" title="Helles Design">☀</button>
      <button data-th="dark" title="Dunkles Design">☾</button>
    </div>
  </div>
</header>

<nav class="tabs" id="tabs">
  <button data-tab="dashboard" class="active">Dashboard</button>
  <button data-tab="plan">4-Wochen-Plan</button>
  <button data-tab="fahrer">Fahrer</button>
  <button data-tab="busse">Busse</button>
  <button data-tab="touren">Touren &amp; Fahrplan</button>
</nav>

<main id="view"></main>

<div id="drawer-root"></div>
<div id="modal-root"></div>
<div id="toast-root"></div>

<script src="js/icons.js"></script>
<script src="js/rules.js"></script>
<script src="js/data.js"></script>
<script src="js/planner.js"></script>
<script src="js/dnd.js"></script>

</html>
